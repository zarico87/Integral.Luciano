<!-- WHATSAPP FLOAT -->
<a href="https://wa.me/543517529016" class="whatsapp" target="_blank">
    💬
</a>
 <script>
  (function() {
    emailjs.init("_CCHtNYhc1rbCWkr4");
  })();

  let tiempoInicio = Date.now();

  document.getElementById("formulario").addEventListener("submit", function(e) {
    e.preventDefault();

    const honeypot = document.getElementById("empresa").value;

    // 🛑 1. Bloquear bots (honeypot)
    if (honeypot !== "") {
      console.log("Spam detectado");
      return;
    }

    // 🛑 2. Bloquear envíos demasiado rápidos (< 3 segundos)
    let tiempoActual = Date.now();
    if ((tiempoActual - tiempoInicio) < 3000) {
      Swal.fire({
        icon: 'warning',
        title: '¡Demasiado rápido!',
        text: 'Esperá unos segundos antes de enviar el formulario nuevamente.',
        confirmButtonColor: '#E8730C'
      });
      return;
    }

    // 🛑 3. Validación de campos
    const nombre = document.querySelector("input[name='nombre']").value.trim();
    const email = document.querySelector("input[name='email']").value.trim();
    const mensaje = document.querySelector("textarea[name='mensaje']").value.trim();

    if (!nombre || !email || !mensaje) {
      Swal.fire({
        icon: 'warning',
        title: 'Campos incompletos',
        text: 'Por favor completá todos los campos.',
        confirmButtonColor: '#E8730C'
      });
      return;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
      Swal.fire({
        icon: 'warning',
        title: 'Email inválido',
        text: 'Por favor ingresá un correo electrónico válido.',
        confirmButtonColor: '#E8730C'
      });
      return;
    }

    if (mensaje.length < 10) {
      Swal.fire({
        icon: 'warning',
        title: 'Mensaje muy corto',
        text: 'El mensaje debe tener al menos 10 caracteres.',
        confirmButtonColor: '#E8730C'
      });
      return;
    }

    // 🚀 Envío con SweetAlert2
    Swal.fire({
      title: 'Enviando...',
      text: 'Aguardá un momento por favor',
      allowOutsideClick: false,
      didOpen: () => {
        Swal.showLoading();
      }
    });

    emailjs.sendForm("service_j18q3sj", "template_aot3bs9", this)
      .then(() => {
        Swal.fire({
          icon: 'success',
          title: '¡Enviado con éxito!',
          text: 'Tu mensaje fue recibido, nos contactaremos pronto.',
          confirmButtonColor: '#26A619'
        });
        this.reset();
        tiempoInicio = Date.now(); // reset tiempo
      })
      .catch(error => {
        console.log(error);
        Swal.fire({
          icon: 'error',
          title: 'El envío falló',
          text: 'Hubo un error de conexión. Por favor intentá más tarde o contactanos por WhatsApp.',
          confirmButtonColor: '#E8730C'
        });
      });
  });

  const menuBtn = document.getElementById('menu-btn');
  const menu = document.getElementById('menu');

  menuBtn.addEventListener('click', () => {
      menu.classList.toggle('hidden');
      menu.classList.toggle('flex');
  });
</script>
